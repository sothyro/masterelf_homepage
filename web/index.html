<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0C">
  <meta name="description" content="Master Elf Feng Shui – Master your timing, environment, and decisions with a proven system rooted in Chinese Metaphysics. Consultations, courses, and events in Cambodia and beyond.">
  <meta name="keywords" content="Feng Shui, BaZi, Qi Men, Chinese Metaphysics, Master Elf, Cambodia, consultation">

  <!-- Canonical URL: ensures masterelf.vip and www.masterelf.vip resolve to one canonical (helps SEO, Telegram link preview) -->
  <link rel="canonical" href="https://www.masterelf.vip">

  <!-- Open Graph (Telegram, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Master Elf Feng Shui">
  <meta property="og:title" content="Master Elf Feng Shui">
  <meta property="og:description" content="Master your timing, environment, and decisions with a proven system rooted in Chinese Metaphysics. Consultations, courses, and events.">
  <meta property="og:url" content="https://www.masterelf.vip">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://www.masterelf.vip/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Master Elf Feng Shui">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Master Elf Feng Shui | Consultations, Courses &amp; Events</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to Google Fonts for faster above-the-fold text rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Firebase (required for Flutter web when using Firestore/Cloud Functions) -->
  <script src="https://www.gstatic.com/firebasejs/11.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.3.0/firebase-functions-compat.js"></script>
  <!-- Preload hero background videos for faster first frame on production web. -->
  <link rel="preload" href="videos/videobackground720.mp4" as="video" type="video/mp4" media="(min-width: 768px)">
  <link rel="preload" href="videos/videobackground480.mp4" as="video" type="video/mp4" media="(max-width: 767px)">

  <!-- Pre-Flutter splash: dark brand background + logo (matches AppColors.backgroundDark).
       Keep web/logomono.png in sync with assets/icons/logomono.webp. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0A0A0C; }
    #splash { display: flex; align-items: center; justify-content: center; height: 100vh; background: #0A0A0C; }
    #splash img { width: min(160px, 40vw); height: auto; }
  </style>
</head>
<body>
  <div id="splash"><img src="logomono.png" alt="Master Elf Feng Shui"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
